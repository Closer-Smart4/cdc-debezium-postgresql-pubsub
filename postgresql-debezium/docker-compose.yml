services:
  db-inventory:
    image: debezium/example-postgres:3.0.0.Final
    restart: always
    environment:
      # Adminer login: postgres / example
      POSTGRES_PASSWORD: example

  adminer:
    image: adminer:4
    restart: always
    ports:
      - 8080:8080
    depends_on:
      - db-inventory

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    restart: always
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
      - --project=local-debezium
    ports:
      - 8085:8085

  pubsub-init:
    image: curlimages/curl:8.11.1
    depends_on:
      - pubsub-emulator
    environment:
      PUBSUB_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT: local-debezium
    volumes:
      - ./init-pubsub.sh:/init-pubsub.sh:ro
    entrypoint: ["/bin/sh", "/init-pubsub.sh"]
    restart: "no"

  debezium:
    image: debezium/server:3.0.0.Final
    restart: always
    depends_on:
      db-inventory:
        condition: service_started
      pubsub-init:
        condition: service_completed_successfully
    environment:
      DEBEZIUM_SINK_TYPE: pubsub
      DEBEZIUM_SINK_PUBSUB_PROJECT_ID: local-debezium
      DEBEZIUM_SINK_PUBSUB_ADDRESS: pubsub-emulator:8085
      DEBEZIUM_SINK_PUBSUB_ORDERING_ENABLED: "false"
      DEBEZIUM_SOURCE_CONNECTOR_CLASS: io.debezium.connector.postgresql.PostgresConnector
      DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME: data/offsets.dat
      DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS: 0
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: db-inventory
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: postgres
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: example
      DEBEZIUM_SOURCE_DATABASE_DBNAME: postgres
      DEBEZIUM_SOURCE_TOPIC_PREFIX: db-inventory
      DEBEZIUM_SOURCE_SCHEMA_INCLUDE_LIST: inventory
      DEBEZIUM_SOURCE_PLUGIN_NAME: pgoutput
